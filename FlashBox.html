<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexbox Practical</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #333;
      padding: 15px 20px;
      border-radius: 6px;
    }
    .logo {
      color: #fff;
      font-weight: bold;
      font-size: 1.2rem;
    }
    .nav-links {
      display: flex;
      gap: 15px;
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .nav-links a {
      color: white;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <h2>Flexbox Navigation Bar</h2>
  <nav class="navbar">
    <div class="logo">MyWebsite</div>
    <ul class="nav-links">
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Services</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>
</body>
</html>
